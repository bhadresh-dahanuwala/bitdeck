name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke test CJS and ESM builds
        run: |
          node -e "const { Deck, popcount } = require('./dist/index.cjs'); const d = new Deck(); const h = d.dealCards(5); if (popcount(h) !== 5 || d.count() !== 47) throw new Error('CJS smoke test failed');"
          node --input-type=module -e "import { Deck, popcount } from './dist/index.js'; const d = new Deck(); const h = d.dealCards(5); if (popcount(h) !== 5 || d.count() !== 47) throw new Error('ESM smoke test failed');"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
